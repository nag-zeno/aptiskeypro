version: "3.9"

services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: aptispro
      POSTGRES_PASSWORD: aptispro_secret
      POSTGRES_DB: aptispro_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # --- FastAPI Backend ---
  api:
    build: .
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://aptispro:aptispro_secret@db:5432/aptispro_db
      DEBUG: "false"
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
