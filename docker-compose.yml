services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: aptispro
      POSTGRES_PASSWORD: aptispro_secret
      POSTGRES_DB: aptispro_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptispro -d aptispro_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- FastAPI Backend ---
  api:
    build: .
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://aptispro:aptispro_secret@db:5432/aptispro_db
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:


