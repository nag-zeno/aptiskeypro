    <script>
        function escapeHtmlAI(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // �?nh d?ng l?i k?t qu? ch?m �i?m AI (text th�) th�nh c�c kh?i d? �?c + t� m�u m?c �i?m CEFR
        function renderAIGradingResult(rawText) {
            const escaped = escapeHtmlAI(rawText);

            const levelColors = {
                A0: '#6c757d', A1: '#0d6efd', A2: '#0dcaf0',
                B1: '#20c997', B2: '#fd7e14', C1: '#dc3545'
            };
            const withBadges = escaped.replace(/\b(A0|A1|A2|B1|B2|C1)\b/g, function (m) {
                const color = levelColors[m] || '#6c757d';
                return '<span class="cefr-badge" style="background:' + color + '">' + m + '</span>';
            });

            const blocks = withBadges
                .split(/\n{2,}/)
                .filter(function (b) { return b.trim().length > 0; })
                .map(function (block) {
                    return '<div class="ai-result-block">' + block.replace(/\n/g, '<br>') + '</div>';
                })
                .join('');

            return '<div class="ai-result-wrapper">' + blocks + '</div>';
        }
    </script>
